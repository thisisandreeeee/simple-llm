[project]
name = "simple-llm"
version = "0.1.0"
description = "Post-train and evaluate a small language model for clear, simple English."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "trl[peft]>=1.9.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipython>=8.0.0",
    "pypdf[crypto]>=5.0.0",
    "pytest>=8.0.0",
]
